# Deploys the app to Vercel on every push to main.
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        a Vercel access token
#   VERCEL_ORG_ID      from `vercel link` output (or the Vercel dashboard)
#   VERCEL_PROJECT_ID   from `vercel link` output (or the Vercel dashboard)
# The workflow skips itself cleanly when the secrets are not configured, so
# forks can run CI without Vercel.
#
# OPENROUTER_API_KEY must be set as a Vercel environment variable
# (Production environment) for the deployed app to reach OpenRouter.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Skip when Vercel secrets are absent
        id: gate
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Vercel CLI
        if: steps.gate.outputs.skip != 'true'
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        if: steps.gate.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --org="${{ secrets.VERCEL_ORG_ID }}" --project="${{ secrets.VERCEL_PROJECT_ID }}"
      - name: Build
        if: steps.gate.outputs.skip != 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}" --org="${{ secrets.VERCEL_ORG_ID }}" --project="${{ secrets.VERCEL_PROJECT_ID }}"
      - name: Deploy to Vercel
        if: steps.gate.outputs.skip != 'true'
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --org="${{ secrets.VERCEL_ORG_ID }}" --project="${{ secrets.VERCEL_PROJECT_ID }}"